<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Kas Keluar - Entri Jurnal Dinamis</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-slate-900 text-white px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <h1 class="text-xl font-bold tracking-tight">Voucher Kas Keluar</h1>
                <p class="text-slate-400 text-sm">Form Entri Jurnal Dinamis</p>
            </div>
            <div class="bg-slate-800 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 border border-slate-700">
                Live Balancing Check
            </div>
        </div>

        <!-- Form Body -->
        <form id="voucherForm" class="p-6 space-y-6" onsubmit="handleSubmit(event)">
            
            <!-- Metadata Header -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pb-4 border-b border-slate-100">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">No. Voucher</label>
                    <input type="text" required value="VKK-2026-001" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Tanggal</label>
                    <input type="date" required value="2026-10-12" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Dibayar Kepada / Keterangan</label>
                    <input type="text" required placeholder="Contoh: Pembayaran ATK Kantor" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Dynamic Journal Rows Table -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider">Detail Jurnal Transaksi</h2>
                    <button type="button" onclick="addRow()" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium rounded-lg transition shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        Tambah Baris
                    </button>
                </div>

                <div class="overflow-x-auto border border-slate-200 rounded-xl">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-xs font-semibold uppercase tracking-wider border-b border-slate-200">
                                <th class="py-3 px-4 w-5/12">Akun</th>
                                <th class="py-3 px-4 w-3/12">Debit (Rp)</th>
                                <th class="py-3 px-4 w-3/12">Kredit (Rp)</th>
                                <th class="py-3 px-4 w-1/12 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="journalRows" class="divide-y divide-slate-200 text-sm">
                            <!-- Rows will be injected here via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Totals & Balancing Indicator Section -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div id="balanceBadge" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 bg-red-100 text-red-700 border border-red-200">
                        <span id="badgeIcon">⚠️</span>
                        <span id="badgeText">Tidak Seimbang</span>
                    </div>
                    <div class="text-xs text-slate-500">
                        Selisih: <span id="diffAmount" class="font-semibold text-slate-700">Rp 0</span>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row items-end sm:items-center gap-6 w-full md:w-auto justify-end">
                    <div class="text-right">
                        <span class="text-xs text-slate-500 block">Total Debit</span>
                        <span id="totalDebit" class="text-base font-bold text-slate-800">Rp 0</span>
                    </div>
                    <div class="text-right">
                        <span class="text-xs text-slate-500 block">Total Kredit</span>
                        <span id="totalKredit" class="text-base font-bold text-slate-800">Rp 0</span>
                    </div>
                </div>
            </div>

            <!-- Submit Action -->
            <div class="flex justify-end pt-2">
                <button type="submit" id="submitBtn" disabled class="px-6 py-2.5 bg-slate-300 text-slate-500 font-medium text-sm rounded-xl cursor-not-allowed transition shadow-sm">
                    Simpan Voucher
                </button>
            </div>

        </form>
    </div>

    <!-- Custom Message Box Modal (Alternative to alert) -->
    <div id="msgModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl border border-slate-100 text-center space-y-4">
            <div id="modalIcon" class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-xl font-bold">✓</div>
            <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Berhasil</h3>
            <p id="modalMessage" class="text-sm text-slate-600">Voucher kas keluar berhasil disimpan.</p>
            <button type="button" onclick="closeModal()" class="w-full py-2 bg-slate-900 text-white rounded-xl text-sm font-medium hover:bg-slate-800 transition">Tutup</button>
        </div>
    </div>

    <script>
        // Predefined list of sample chart of accounts for voucher kas keluar
        const sampleAccounts = [
            { code: "1-1110", name: "Kas Besar / Kecil" },
            { code: "1-1120", name: "Bank BCA" },
            { code: "5-1110", name: "Biaya Gaji" },
            { code: "5-1210", name: "Biaya ATK & Perlengkapan Kantor" },
            { code: "5-1310", name: "Biaya Listrik & Air" },
            { code: "5-1410", name: "Biaya Konsumsi Rapat" },
            { code: "2-1110", name: "Hutang Usaha" }
        ];

        // Format number to currency IDR string
        function formatIDR(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        }

        // Add initial default rows on load
        window.onload = function() {
            addRow('5-1210', 150000, 0);
            addRow('1-1110', 0, 150000);
        };

        // Add a new row to the journal table
        function addRow(defaultAccount = '', defaultDebit = 0, defaultKredit = 0) {
            const tbody = document.getElementById('journalRows');
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50/50 transition";

            let optionsHtml = '<option value="">-- Pilih Akun --</option>';
            sampleAccounts.forEach(acc => {
                const selected = (acc.code === defaultAccount) ? 'selected' : '';
                optionsHtml += `<option value="${acc.code}" ${selected}>${acc.code} - ${acc.name}</option>`;
            });

            tr.innerHTML = `
                <td class="py-2.5 px-4">
                    <select required class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        ${optionsHtml}
                    </select>
                </td>
                <td class="py-2.5 px-4">
                    <input type="number" min="0" value="${defaultDebit}" oninput="handleAmountInput(this, 'debit')" class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 debit-input">
                </td>
                <td class="py-2.5 px-4">
                    <input type="number" min="0" value="${defaultKredit}" oninput="handleAmountInput(this, 'kredit')" class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 kredit-input">
                </td>
                <td class="py-2.5 px-4 text-center">
                    <button type="button" onclick="removeRow(this)" class="p-1.5 text-slate-400 hover:text-red-600 rounded-lg transition" title="Hapus Baris">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
            calculateTotals();
        }

        // Remove row and recalculate
        function removeRow(btn) {
            const tbody = document.getElementById('journalRows');
            if (tbody.rows.length <= 1) {
                showModal("Peringatan", "Minimal harus ada 1 baris jurnal.", "⚠️", "text-amber-600", "bg-amber-100");
                return;
            }
            btn.closest('tr').remove();
            calculateTotals();
        }

        // Handle mutual exclusivity or standard input values
        function handleAmountInput(input, type) {
            const row = input.closest('tr');
            const debitInput = row.querySelector('.debit-input');
            const kreditInput = row.querySelector('.kredit-input');

            // Optional enhancement: if user inputs debit, we can clear kredit or let them input freely.
            // Keeping standard accounting freedom: user can input both or single per row, totals accumulate live.
            calculateTotals();
        }

        // Live calculation of totals and balancing status
        function calculateTotals() {
            const debitInputs = document.querySelectorAll('.debit-input');
            const kreditInputs = document.querySelectorAll('.kredit-input');

            let totalDebit = 0;
            let totalKredit = 0;

            debitInputs.forEach(input => {
                totalDebit += parseFloat(input.value) || 0;
            });

            kreditInputs.forEach(input => {
                totalKredit += parseFloat(input.value) || 0;
            });

            document.getElementById('totalDebit').innerText = formatIDR(totalDebit);
            document.getElementById('totalKredit').innerText = formatIDR(totalKredit);

            const diff = Math.abs(totalDebit - totalKredit);
            document.getElementById('diffAmount').innerText = formatIDR(diff);

            const balanceBadge = document.getElementById('balanceBadge');
            const badgeIcon = document.getElementById('badgeIcon');
            const badgeText = document.getElementById('badgeText');
            const submitBtn = document.getElementById('submitBtn');

            // Check if balanced (Total Debit == Total Kredit and both > 0)
            const isBalanced = (totalDebit > 0 || totalKredit > 0) && (totalDebit === totalKredit);

            if (isBalanced) {
                balanceBadge.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 bg-emerald-100 text-emerald-700 border border-emerald-200";
                badgeIcon.innerText = "✓";
                badgeText.innerText = "Seimbang (Balanced)";
                
                // Enable submit button
                submitBtn.disabled = false;
                submitBtn.className = "px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-xl cursor-pointer transition shadow-sm";
            } else {
                balanceBadge.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 bg-red-100 text-red-700 border border-red-200";
                badgeIcon.innerText = "⚠️";
                badgeText.innerText = "Tidak Seimbang";

                // Disable submit button
                submitBtn.disabled = true;
                submitBtn.className = "px-6 py-2.5 bg-slate-300 text-slate-500 font-medium text-sm rounded-xl cursor-not-allowed transition shadow-sm";
            }
        }

        // Form submission handler
        function handleSubmit(event) {
            event.preventDefault();
            showModal("Sukses", "Voucher Kas Keluar berhasil divalidasi dan disimpan ke sistem.", "✓", "text-emerald-600", "bg-emerald-100");
        }

        // Custom modal helper
        function showModal(title, message, iconText, textColorClass, bgColorClass) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            const iconEl = document.getElementById('modalIcon');
            iconEl.innerText = iconText;
            iconEl.className = `w-12 h-12 rounded-full ${bgColorClass} ${textColorClass} flex items-center justify-center mx-auto text-xl font-bold`;
            document.getElementById('msgModal').classList.remove('hidden');
            document.getElementById('msgModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('msgModal').classList.remove('flex');
            document.getElementById('msgModal').classList.add('hidden');
        }
    </script>

</body>
</html>
